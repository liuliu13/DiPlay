name: Build DiPlay manual-video-mode APK
# 支持手动触发，不需要push自动跑
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 拉取指定分支 PatrikTheDev/manual-video-mode
          ref: manual-video-mode
          fetch-depth: 0

      - name: Setup JDK 17 (项目必须JDK17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-manual-video-mode-mobile-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          retention-days: 30